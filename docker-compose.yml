version: '3.8'

services:
  # Database Service
  mongodb:
    image: mongo:latest
    container_name: discord_bot_list_db
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - dbl_network

  # Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: discord_bot_list_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/discord_bot_list
      - SESSION_SECRET=prod-secret-session-key-change-this
      - JWT_SECRET=prod-secret-jwt-signing-key-change-this
      - JWT_EXPIRES_IN=7d
      - ALLOWED_ORIGINS=http://localhost:3000
    depends_on:
      - mongodb
    networks:
      - dbl_network

  # Frontend NextJS App Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: discord_bot_list_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:5000
    depends_on:
      - backend
    networks:
      - dbl_network

volumes:
  mongo_data:

networks:
  dbl_network:
    driver: bridge
